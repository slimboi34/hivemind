services:
  hivemind:
    # Built from this repository. Run: docker compose up --build
    build: .
    image: hivemind:latest
    container_name: hivemind
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "5001:5001"
    restart: unless-stopped
    volumes:
      - ./backend/uploads:/app/backend/uploads
